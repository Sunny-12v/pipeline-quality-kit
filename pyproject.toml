[project]
name = "pipeline-quality-kit"
version = "0.1.0"
description = "Data quality checks as code: describe checks in YAML, run them on DuckDB, fail CI when data is bad."
requires-python = ">=3.9"
dependencies = ["duckdb>=1.0", "pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
pqk = "pqk.cli:main"

[tool.setuptools]
packages = ["pqk"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
